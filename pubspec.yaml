name: qrty
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  image_picker: ^1.2.1
  objectbox: ^5.0.4
  easy_localization: ^3.0.8 #flutter pub run easy_localization:generate -S assets/translations -f keys -O lib/l10n -o locale_keys.g.dart
  device_preview: ^1.3.1
  animated_bottom_navigation_bar: ^1.4.0
  flutter_svg: ^2.2.3
  equatable: ^2.0.7
  share_plus: ^12.0.1
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.3.4
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  objectbox_flutter_libs: any

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  objectbox_generator: ^5.0.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21 

objectbox:

  # Or optionally specify the lib and test output folder separately.
  output_dir:
    lib: core/storage/

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/translations/
    - assets/sounds/


  fonts:
    - family: Itim
      fonts:
        - asset: assets/fonts/itim/Itim-Regular.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #

